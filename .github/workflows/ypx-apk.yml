name: YPX xodimi APK

on:
  push:
    branches-ignore:
      - ypx-ci-log
    paths:
      - 'ypx-oyin/**'
      - '.github/workflows/ypx-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ovoz fayllarini yuklab olish
        run: |
          M=ypx-oyin/web3d/audio/manifest.txt
          [ -f "$M" ] || exit 0
          grep -v '^#' "$M" | while read -r f url; do
            [ -n "$f" ] || continue
            mkdir -p "ypx-oyin/web3d/audio/$(dirname "$f")"
            curl -sfL -o "ypx-oyin/web3d/audio/$f" "$url" && echo "OK $f" || echo "::warning::yuklab bo'lmadi: $f"
          done
          ls -R ypx-oyin/web3d/audio

      - name: APK yig'ish
        working-directory: ypx-oyin/android
        run: gradle --no-daemon assembleRelease 2>&1 | tee ../../build.log; exit ${PIPESTATUS[0]}

      - name: APK nomini o'zgartirish
        run: cp ypx-oyin/android/app/build/outputs/apk/release/app-release.apk ypx-xodimi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ypx-xodimi-apk
          path: ypx-xodimi.apk

      - name: Ovozlarni repoga saqlash
        run: |
          M=ypx-oyin/web3d/audio/manifest.txt
          [ -f "$M" ] && grep -qv '^#' "$M" || exit 0
          grep '^#' "$M" > "$M.tmp" && mv "$M.tmp" "$M"
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add ypx-oyin/web3d/audio
          git commit -qm "Add downloaded voice lines" && git push origin HEAD:${GITHUB_REF_NAME} || true

      # On failure, store the build log on a side branch so it can be read with git.
      - name: Xato logini saqlash
        if: failure()
        run: |
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ypx-ci-log
          git rm -rfq . || true
          cp /tmp/build.log build.log
          git add build.log && git commit -qm "CI build log ${GITHUB_SHA}"
          git push -f origin ypx-ci-log
