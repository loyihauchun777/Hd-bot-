plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.ypx.oyin'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.ypx.oyin'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly; replace with your own keystore for Play Market.
            signingConfig signingConfigs.debug
        }
    }

    // The game itself lives in ../../web and is bundled as app assets.
    sourceSets {
        main.assets.srcDirs = ['../../web']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
