plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.ypx.oyin'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.ypx.oyin'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '2.0-3d'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly; replace with your own keystore for Play Market.
            signingConfig signingConfigs.debug
        }
    }

    // The game itself lives in ../../web3d and is bundled as app assets.
    sourceSets {
        main.assets.srcDirs = ['../../web3d']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
